<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="Windows-1252">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="keywords" content="Lucas, Alexander">
        <meta name ="author" content="Lucas Alexander">
        <link rel="stylesheet" href="css/main.css">
        <link rel="stylesheet" href="css/writing.css">
        <link rel="stylesheet" href="css/storyviewer.css">
        <link rel="icon" type="image/png" href="images/favicon-32x32.png">
        <title>Lucas Alexander's Website</title>
    </head>
    <body>
        <div id="navbar"></div> <script src="js/navbarfetch.js"></script>
        <div class="official">
            <div class="hoot" class="flex-container">
                <img src="images/brandeis_hoot.png" alt="Brandeis Hoot logo">
                <p>
                    I have held one professional writing position in my life, at the student newspaper of Brandeis University, 
                    <a href="https://brandeishoot.com/about/"> The Hoot </a>
                </p>
            </div>
        </div>
        <hr>
        <div clas="unoffical">
            <div class="personal">
                <p>I also write a lot in my free time. Much of this work is private, but I've included several samples for you here. </p>
            </div>
            <div class="storyplace"> 
                <aside class="story-select"> 
                    <h2> Stories </h2>
                    <button class="story-button active" data-document="files/MermaidAndTheSkyPearl.pdf"> The Mermaid and the Sky Pearl </button>
                    <button class="story-button" data-document="files/TheRabbitandTheWolf.pdf"> The Rabbit and the Wolf </button>
                    <h2> Poems</h2>
                    <button class="story-button" data-document="files/ThatQuietMoment.pdf"> That Quiet Moment </button>
                </aside>
                <main class="story-container"> <iframe src="files/MermaidAndTheSkyPearl.pdf"> </iframe></main>
            </div>
        </div>
        <script src="js/storydisplay.js"></script>
    </body>
</html>
